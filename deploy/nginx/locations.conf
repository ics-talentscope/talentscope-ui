server_tokens off;
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;
client_max_body_size 25m;

if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
}

location ~* /\.(?!well-known) {
    return 404;
}

location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak|ini)$ {
    return 404;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 330s;

location ~ ^/api/(admin/auth|employee/auth)/login$ {
    limit_req zone=ts_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
}

location = /api/interview/access {
    limit_req zone=ts_login burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
}

location ~ ^/api/interview/[^/]+/upload_video$ {
    client_max_body_size 130m;
    client_body_timeout 300s;
    limit_req zone=ts_upload burst=10 nodelay;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
}

location /api/ {
    limit_req zone=ts_api burst=90 nodelay;
    limit_conn ts_conn 60;
    proxy_pass http://127.0.0.1:3000;
}

location / {
    limit_conn ts_conn 60;
    proxy_pass http://127.0.0.1:3000;
}
