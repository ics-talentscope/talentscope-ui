# ============================================================================
# TalentScope – Nginx site configuration (HTTPS with PFX-derived certs)
# ============================================================================
# Install: sudo cp talentscope.conf /etc/nginx/sites-available/talentscope
#          sudo ln -sf /etc/nginx/sites-available/talentscope /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Rate-limit zones (must be in http{} context, loaded via conf.d/)
# → see ratelimit-zones.conf → /etc/nginx/conf.d/talentscope-ratelimit.conf

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name talentscope.infinite.com;

    # Allow ACME challenges for future Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talentscope.infinite.com;

    # ── SSL certificate (extracted from PFX) ──────────────────────────────
    ssl_certificate         /etc/ssl/certs/talentscope.fullchain.pem;
    ssl_certificate_key     /etc/ssl/private/talentscope.key;

    # ── SSL hardening ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TalentScope_SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling (improves TLS handshake performance)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Include location blocks & rate-limiting ───────────────────────────
    include /etc/nginx/snippets/talentscope-locations.conf;
}

